services:
  webdl-bridge:
    build: .
    container_name: webdl-bridge
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./server.py:/app/server.py:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4700/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
